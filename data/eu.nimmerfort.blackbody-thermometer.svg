<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="128px"
   height="128px"
   viewBox="0 0 128 128"
   version="1.1"
   id="svg27"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs19">
    <radialGradient
       id="radial0"
       gradientUnits="userSpaceOnUse"
       cx="131.914749"
       cy="55.927143"
       fx="131.914749"
       fy="55.927143"
       r="160"
       gradientTransform="matrix(0.232034,-0.541475,-0.368794,-0.0298398,4.277749,118.95849)">
      <stop
         offset="0"
         style="stop-color:#392971;stop-opacity:1;"
         id="stop1" />
      <stop
         offset="1"
         style="stop-color:#458CFD;stop-opacity:1;"
         id="stop2" />
    </radialGradient>
    <radialGradient
       id="radial1"
       gradientUnits="userSpaceOnUse"
       cx="525.587769"
       cy="638.591797"
       fx="525.587769"
       fy="638.591797"
       r="192"
       gradientTransform="matrix(-0.107656,-0.225172,-0.327748,0.258343,373.87973,30.205086)">
      <stop
         offset="0"
         style="stop-color:#FA7C20;stop-opacity:1;"
         id="stop3" />
      <stop
         offset="1"
         style="stop-color:#D2E935;stop-opacity:0.00829876;"
         id="stop4" />
    </radialGradient>
    <!-- Thermometer: glass tube, horizontal gradient for the curved surface -->
    <linearGradient
       id="th-glass"
       gradientUnits="userSpaceOnUse"
       x1="48" y1="0" x2="80" y2="0">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#f6f5f4" />
      <stop offset="1" stop-color="#deddda" />
    </linearGradient>
    <!-- Thermometer: mercury column, GNOME red -->
    <linearGradient
       id="th-mercury"
       gradientUnits="userSpaceOnUse"
       x1="0" y1="38" x2="0" y2="82">
      <stop offset="0" stop-color="#f66151" />
      <stop offset="1" stop-color="#e01b24" />
    </linearGradient>
    <!-- Thermometer: glowing bulb -->
    <radialGradient
       id="th-bulb"
       gradientUnits="userSpaceOnUse"
       cx="59" cy="77" r="22">
      <stop offset="0" stop-color="#f66151" />
      <stop offset="0.55" stop-color="#e01b24" />
      <stop offset="1" stop-color="#c01c28" />
    </radialGradient>
  </defs>
  <!-- Photo frame -->
  <path
     style="fill:#f5f5f3;fill-opacity:1;fill-rule:nonzero;stroke:none"
     d="m 20,11.957031 h 88 c 4.41797,0 8,3.582031 8,8 V 108 c 0,4.41797 -3.58203,8 -8,8 H 20 c -4.417969,0 -8,-3.58203 -8,-8 V 19.957031 c 0,-4.417969 3.582031,-8 8,-8 z m 0,0"
     id="path19" />
  <!-- Thermogram -->
  <path
     style="fill:url(#radial0);fill-rule:nonzero;stroke:none"
     d="m 20,85.957031 h 88 v -66 H 20 Z m 0,0"
     id="path20" />
  <path
     style="fill:url(#radial1);fill-rule:nonzero;stroke:none"
     d="m 20,85.957031 h 88 v -66 H 20 Z m 0,0"
     id="path21" />
  <!-- Thermometer over the left side, bulb resting on the 120px baseline -->
  <g id="thermometer" transform="translate(-24,20)">
    <!-- Front profile: 2px extrusion below the glass for depth -->
    <g fill="#c0bfbc" id="th-profile">
      <rect x="54" y="19" width="20" height="64" rx="10" />
      <circle cx="64" cy="84" r="16" />
    </g>
    <!-- Glass body: tube + bulb, one continuous gradient -->
    <g fill="url(#th-glass)" id="th-body">
      <rect x="54" y="17" width="20" height="64" rx="10" />
      <circle cx="64" cy="82" r="16" />
    </g>
    <!-- Mercury column -->
    <rect x="60" y="38" width="8" height="44" rx="4" fill="url(#th-mercury)" id="th-column" />
    <!-- Bulb -->
    <circle cx="64" cy="82" r="11" fill="url(#th-bulb)" id="th-bulb-circle" />
    <!-- Glass highlights -->
    <line x1="58" y1="25" x2="58" y2="70" stroke="#ffffff" stroke-width="2"
          stroke-linecap="round" opacity="0.6" id="th-highlight" />
    <circle cx="59" cy="77" r="3" fill="#ffffff" opacity="0.5" id="th-bulb-highlight" />
  </g>
</svg>
