[package]
name = "libblackbody"
description = "Decode thermograms regardless of format - FLIR, Fluke, TIFF, PNG - providing a standard interface for all."
version = "0.6.0"
license = "EUPL-1.2"
authors = [ "Arthur Nieuwland <anieuwland@nimmerfort.eu>",]
edition = "2024"
repository = "https://github.com/anieuwland/blackbody/tree/main/libblackbody"
exclude = ["thermograms/"]

[dependencies]
enum_dispatch = "0.3"
# flyr = { path = "../../flyr-rs", version = "0.8.0" }
flyr = "0.8"
imgref = "1"
log = "0.4"
ndarray = { version = "0.17", optional = true }
rgb = "0.8"
# libblackbody — revert to the registry dependency before publishing
serendip = { path = "../../serendip", version = "0.4.0" }
# serendip = "0.4"
tiff = "0.11"
uom = "0.38"

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg"]

[features]
ndarray = ["dep:ndarray"]
