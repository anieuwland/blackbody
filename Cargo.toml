[package]
name = "blackbody"
version = "0.1.0"
authors = ["Arthur Nieuwland <anieuwland@nimmerfort.eu>"]
edition = "2018"

[dependencies]
tiff = { git = 'https://github.com/image-rs/image-tiff/' }
byteorder = "*"
ndarray = "0.13.0"
ndarray-stats = "0.3.0"
binread = "1.1.1"

[dependencies.gtk]
version = "0.8.1"
features = ["v3_24"]

[dependencies.gdk]
version = "0.12.1"
features = ["v3_24"]

[dependencies.gdk-pixbuf]
version = "0.8.0"
features = ["v2_32"]

[dependencies.gio]
version = "0.8.1"
features = ["v2_60"]

[dependencies.glib]
version = "0.9.2"
features = ["v2_60"]

[dependencies.gettext-rs]
version = "0.4.4"
features = ["gettext-system"]
